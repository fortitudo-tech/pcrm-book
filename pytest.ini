[pytest]
# Pytest configuration for pcrm-book agents

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum version
minversion = 7.0

# Add current directory to Python path
pythonpath = .

# Coverage options
addopts =
    --verbose
    --strict-markers
    --cov=src/agents
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=80
    -ra

# Markers for test organization
markers =
    unit: Unit tests for individual components
    integration: Integration tests
    slow: Slow running tests
    network: Tests that require network access

# Ignore paths
norecursedirs =
    .git
    .github
    __pycache__
    *.egg-info
    .pytest_cache
    .coverage
    htmlcov
    dist
    build

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
